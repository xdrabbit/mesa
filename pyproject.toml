[project]
name = "mesa"
version = "0.1.0"
description = "Watchdog + Prospector agents for options monitoring"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.36",
    "python-telegram-bot>=21.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "requests>=2.31",        # mesa.universe
    "beautifulsoup4>=4.12",  # mesa.universe (Wikipedia S&P 500 table)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
mesa = "mesa.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
